openapi: 3.0.3
info:
  title: CAB System - Operations & Security API
  version: 1.1.0
  description: |-
    API quản trị Customer, Driver, Vehicle, Trip, phân quyền và Audit Log.
    Thiết kế dựa trên các Functional Requirements của SRS.

    Chuẩn hóa v1.1: role authorization, error contract, traceability và security cho internal/webhook API.
servers:
  - url: /api/v1
tags:
  - name: Customer Management
  - name: Driver Management
  - name: Vehicle Management
  - name: Trip Operations
  - name: Access Control
  - name: Audit

paths:
  /operator/customers:
    get:
      tags: [Customer Management]
      summary: Xem danh sách Customer
      security: [bearerAuth: []]
      x-fr: [FR46, FR57]
      responses:
        '200':
          description: Danh sách Customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Customer'}
                  total: {type: integer}
        '401':
          description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Đã xác thực nhưng không có quyền thực hiện thao tác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getOperatorCustomers
      x-roles:
        - OPERATOR
        - ADMIN
  /operator/customers/{customerId}:
    get:
      tags: [Customer Management]
      summary: Xem thông tin Customer
      security: [bearerAuth: []]
      x-fr: [FR47, FR57, FR58]
      parameters:
        - {name: customerId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Customer'}
        '404': {description: Customer không tồn tại, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401':
          description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Đã xác thực nhưng không có quyền thực hiện thao tác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getOperatorCustomersCustomerId
      x-roles:
        - OPERATOR
        - ADMIN
    patch:
      tags: [Customer Management]
      summary: Cập nhật thông tin Customer
      security: [bearerAuth: []]
      x-fr: [FR48, FR57, FR58]
      parameters:
        - {name: customerId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                fullName: {type: string}
                email: {type: string, format: email}
                phone: {type: string}
      responses:
        '200': {description: Cập nhật thành công}
        '403': {description: Không có quyền, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401':
          description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: patchOperatorCustomersCustomerId
      x-roles:
        - OPERATOR
        - ADMIN
  /operator/customers/{customerId}/status:
    patch:
      tags: [Customer Management]
      summary: Khóa/Mở khóa tài khoản Customer
      security: [bearerAuth: []]
      x-fr: [FR49, FR57, FR59]
      parameters:
        - {name: customerId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [ACTIVE, LOCKED]}
      responses:
        '200': {description: Trạng thái tài khoản được cập nhật}
        '401':
          description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Đã xác thực nhưng không có quyền thực hiện thao tác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: patchOperatorCustomersCustomerIdStatus
      x-roles:
        - OPERATOR
        - ADMIN
  /operator/drivers:
    get:
      tags: [Driver Management]
      summary: Xem danh sách và thông tin Driver
      security: [bearerAuth: []]
      x-fr: [FR50, FR57, FR58]
      responses:
        '200':
          description: Danh sách Driver
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Driver'}
                  total: {type: integer}
        '401':
          description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Đã xác thực nhưng không có quyền thực hiện thao tác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getOperatorDrivers
      x-roles:
        - OPERATOR
        - ADMIN
  /operator/drivers/{driverId}:
    get:
      tags: [Driver Management]
      summary: Xem thông tin Driver
      security: [bearerAuth: []]
      x-fr: [FR50, FR57, FR58]
      parameters:
        - {name: driverId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Driver
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Driver'}
        '401':
          description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Đã xác thực nhưng không có quyền thực hiện thao tác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getOperatorDriversDriverId
      x-roles:
        - OPERATOR
        - ADMIN
    patch:
      tags: [Driver Management]
      summary: Cập nhật thông tin/trạng thái Driver
      security: [bearerAuth: []]
      x-fr: [FR50, FR57, FR59]
      parameters:
        - {name: driverId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: {type: string}
                availability: {type: string, enum: [AVAILABLE, UNAVAILABLE]}
      responses:
        '200': {description: Cập nhật thành công}
        '401':
          description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Đã xác thực nhưng không có quyền thực hiện thao tác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: patchOperatorDriversDriverId
      x-roles:
        - OPERATOR
        - ADMIN
  /operator/vehicles:
    get:
      tags: [Vehicle Management]
      summary: Xem danh sách Vehicle
      security: [bearerAuth: []]
      x-fr: [FR51, FR57]
      responses:
        '200':
          description: Danh sách Vehicle
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Vehicle'}
        '401':
          description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Đã xác thực nhưng không có quyền thực hiện thao tác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getOperatorVehicles
      x-roles:
        - OPERATOR
        - ADMIN
    post:
      tags: [Vehicle Management]
      summary: Thêm Vehicle
      security: [bearerAuth: []]
      x-fr: [FR51, FR57, FR59]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleInput'
      responses:
        '201': {description: Vehicle được tạo}
        '409': {description: Biển số xe đã tồn tại, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401':
          description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Đã xác thực nhưng không có quyền thực hiện thao tác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: postOperatorVehicles
      x-roles:
        - OPERATOR
        - ADMIN
  /operator/vehicles/{vehicleId}:
    get:
      tags:
        - Vehicle Management
      summary: Xem chi tiết Vehicle
      security:
        - bearerAuth: []
      x-fr:
        - FR51
        - FR57
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '404':
          description: Vehicle không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Đã xác thực nhưng không có quyền thực hiện thao tác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getOperatorVehiclesVehicleId
      x-roles:
        - OPERATOR
        - ADMIN
    patch:
      tags: [Vehicle Management]
      summary: Cập nhật Vehicle
      security: [bearerAuth: []]
      x-fr: [FR51, FR57, FR59]
      parameters:
        - {name: vehicleId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VehicleUpdate'}
      responses:
        '200': {description: Vehicle được cập nhật}
        '401':
          description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Đã xác thực nhưng không có quyền thực hiện thao tác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: patchOperatorVehiclesVehicleId
      x-roles:
        - OPERATOR
        - ADMIN
  /operator/trips:
    get:
      tags: [Trip Operations]
      summary: Tra cứu lịch sử Trip
      security: [bearerAuth: []]
      x-fr: [FR52, FR54, FR57]
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: driverId, in: query, schema: {type: string}}
        - {name: customerId, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Danh sách Trip
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Trip'}
                  total: {type: integer}
        '401':
          description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Đã xác thực nhưng không có quyền thực hiện thao tác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getOperatorTrips
      x-roles:
        - OPERATOR
        - ADMIN
  /operator/roles:
    get:
      tags: [Access Control]
      summary: Xem vai trò/quyền
      security: [bearerAuth: []]
      x-fr: [FR04, FR57]
      responses:
        '200':
          description: Danh sách role và permission
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Đã xác thực nhưng không có quyền thực hiện thao tác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getOperatorRoles
      x-roles:
        - ADMIN
  /operator/users/{userId}/role:
    patch:
      tags: [Access Control]
      summary: Cập nhật vai trò người dùng
      security: [bearerAuth: []]
      x-fr: [FR04, FR57, FR59]
      parameters:
        - {name: userId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: {type: string, enum: [CUSTOMER, DRIVER, OPERATOR, ADMIN]}
      responses:
        '200': {description: Vai trò được cập nhật}
        '403': {description: Không có quyền quản lý phân quyền, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401':
          description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: patchOperatorUsersUserIdRole
      x-roles:
        - ADMIN
  /operator/audit-logs:
    get:
      tags: [Audit]
      summary: Tra cứu Audit Log
      security: [bearerAuth: []]
      x-fr: [FR59]
      parameters:
        - {name: actorId, in: query, schema: {type: string}}
        - {name: resourceType, in: query, schema: {type: string}}
        - {name: resourceId, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Audit Logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AuditLog'}
                  total: {type: integer}
        '401':
          description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Đã xác thực nhưng không có quyền thực hiện thao tác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getOperatorAuditLogs
      x-roles:
        - OPERATOR
        - ADMIN
  /internal/audit-logs:
    post:
      tags: [Audit]
      summary: Ghi Audit Log cho thao tác quan trọng
      security:
        - serviceAuth: []
      x-fr: [FR59]
      description: API nội bộ; các thao tác quản trị/quan trọng được ghi nhận để truy vết.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditLogInput'
      responses:
        '201': {description: Audit Log được ghi nhận}
        '401':
          description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: postInternalAuditLogs
      x-auth-context: SERVICE_TO_SERVICE

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT dành cho giao tiếp service-to-service; không sử dụng token của Customer/Driver.
  schemas:
    Customer:
      type: object
      properties:
        id: {type: string}
        fullName: {type: string}
        email: {type: string, format: email}
        phone: {type: string}
        role: {type: string, enum: [CUSTOMER]}
        status: {type: string, enum: [ACTIVE, LOCKED]}
    Driver:
      type: object
      properties:
        id: {type: string}
        fullName: {type: string}
        email: {type: string, format: email}
        phone: {type: string}
        role: {type: string, enum: [DRIVER]}
        availability: {type: string, enum: [AVAILABLE, UNAVAILABLE]}
    Vehicle:
      type: object
      properties:
        id: {type: string}
        driverId: {type: string}
        vehicleTypeId: {type: string}
        plateNumber: {type: string}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
    VehicleInput:
      type: object
      required: [driverId, vehicleTypeId, plateNumber]
      properties:
        driverId: {type: string}
        vehicleTypeId: {type: string}
        plateNumber: {type: string}
    VehicleUpdate:
      type: object
      properties:
        vehicleTypeId: {type: string}
        plateNumber: {type: string}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
    Trip:
      type: object
      properties:
        id: {type: string}
        bookingId: {type: string}
        driverId: {type: string}
        status: {type: string}
    Role:
      type: object
      properties:
        role: {type: string, enum: [CUSTOMER, DRIVER, OPERATOR, ADMIN]}
        permissions:
          type: array
          items: {type: string}
    AuditLog:
      type: object
      properties:
        id: {type: string}
        actorId: {type: string}
        action: {type: string}
        resourceType: {type: string}
        resourceId: {type: string}
        createdAt: {type: string, format: date-time}
        details: {type: object, additionalProperties: true}
    AuditLogInput:
      type: object
      required: [actorId, action, resourceType]
      properties:
        actorId: {type: string}
        action: {type: string}
        resourceType: {type: string}
        resourceId: {type: string}
        details: {type: object, additionalProperties: true}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        details: {type: object, additionalProperties: true}
x-fr-traceability:
  - FR04
  - FR46
  - FR47
  - FR48
  - FR49
  - FR50
  - FR51
  - FR52
  - FR54
  - FR57
  - FR58
  - FR59
