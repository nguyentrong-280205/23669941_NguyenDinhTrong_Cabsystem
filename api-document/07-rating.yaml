openapi: 3.0.3
info:
  title: CAB System - Rating API
  version: 1.0.0
  description: |
    API đánh giá Driver sau khi Trip hoàn thành; SRS quy định điều kiện đánh giá trong Business Rule/UC10.
    Thiết kế dựa trên các Functional Requirements của SRS.
servers:
  - url: /api/v1
tags:
  - name: Rating

paths:
  /trips/{tripId}/rating:
    post:
      tags: [Rating]
      summary: Đánh giá Driver sau chuyến
      security: [{bearerAuth: []}]
      x-fr: []
      description: Customer chỉ được đánh giá Trip đã hoàn thành và không đánh giá lại nếu chính sách không cho phép.
      parameters:
        - {name: tripId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: {type: integer, minimum: 1, maximum: 5}
                comment: {type: string}
      responses:
        '201':
          description: Rating được lưu
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Rating'}
        '409': {description: Trip chưa hoàn thành hoặc đã được đánh giá}
        '422': {description: Điểm đánh giá không hợp lệ}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Rating:
      type: object
      properties:
        id: {type: string}
        tripId: {type: string}
        customerId: {type: string}
        driverId: {type: string}
        score: {type: integer, minimum: 1, maximum: 5}
        comment: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        details: {type: object, additionalProperties: true}
x-fr-traceability:

