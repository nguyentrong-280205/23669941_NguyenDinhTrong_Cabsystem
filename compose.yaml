        condition: service_healthy
      customer-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      trip-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:8080/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: *a1
    ports:
      - "${GATEWAY_PORT:-8081}:8080"
  sandbox:
    build:
      context: .
      dockerfile: infra/sandbox/Dockerfile
    restart: unless-stopped
    environment:
      PAYMENT_PROVIDER_SECRET: ${PAYMENT_PROVIDER_SECRET:?PAYMENT_PROVIDER_SECRET must be configured}
      NOTIFICATION_PROVIDER_SECRET: ${NOTIFICATION_PROVIDER_SECRET:?NOTIFICATION_PROVIDER_SECRET must be configured}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be configured}
      ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-v1}
      SANDBOX_DATA_DIR: /data
      GATEWAY_URL: http://gateway:8080
    volumes:
      - sandbox_data:/data
    networks: *a1
  seed:
    profiles:
      - tools
    build:
      context: .
      dockerfile: infra/sandbox/Dockerfile
    entrypoint:
      - node
      - scripts/seed-demo.js
    environment:
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
      REGISTRATION_SECRET: ${REGISTRATION_SECRET:?REGISTRATION_SECRET must be configured}
      OTP_SECRET: ${OTP_SECRET:?OTP_SECRET must be configured}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be configured}
      ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-v1}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      HTTP_TIMEOUT_MS: "4000"
      SEED_CONTAINER: "true"
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be configured}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:?CUSTOMER_DB_PASSWORD must be configured}
      DRIVER_DB_PASSWORD: ${DRIVER_DB_PASSWORD:?DRIVER_DB_PASSWORD must be configured}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?BOOKING_DB_PASSWORD must be configured}
      TRIP_DB_PASSWORD: ${TRIP_DB_PASSWORD:?TRIP_DB_PASSWORD must be configured}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD must be configured}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD must be configured}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks: *a1
volumes:
  postgres_v2: {}
  mongo_data: {}
  mongo_config: {}
  redis_data: {}
  kafka_data: {}
  sandbox_data: {}
networks:
  cab-network:
    driver: bridge
