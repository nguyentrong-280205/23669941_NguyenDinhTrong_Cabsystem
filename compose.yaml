name: cab-system
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cab_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be configured}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?BOOKING_DB_PASSWORD must be configured}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD must be configured}
    volumes:
      - postgres_v2:/var/lib/postgresql/data
      - ./infra/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$POSTGRES_USER"
      interval: 5s
      timeout: 5s
      retries: 15
    networks: &a1
      - cab-network
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    entrypoint:
      - bash
      - /bootstrap/start.sh
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-cab_root}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be configured}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:?CUSTOMER_DB_PASSWORD must be configured}
      DRIVER_DB_PASSWORD: ${DRIVER_DB_PASSWORD:?DRIVER_DB_PASSWORD must be configured}
      TRIP_DB_PASSWORD: ${TRIP_DB_PASSWORD:?TRIP_DB_PASSWORD must be configured}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD must be configured}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./infra/mongodb:/bootstrap:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --eval 'const a=db.getSiblingDB("admin");a.auth(process.env.MONGO_ROOT_USER,process.env.MONGO_ROOT_PASSWORD);quit(db.hello().isWritablePrimary?0:1)'
      interval: 5s
      timeout: 5s
      retries: 30
    networks: *a1
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - yes
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
    networks: *a1
  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 15
    networks: *a1
  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - bash
      - /setup/topics.sh
    volumes:
      - ./infra/kafka:/setup:ro
    networks: *a1
  identity-service:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
      REGISTRATION_SECRET: ${REGISTRATION_SECRET:?REGISTRATION_SECRET must be configured}
      OTP_SECRET: ${OTP_SECRET:?OTP_SECRET must be configured}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be configured}
      ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-v1}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      HTTP_TIMEOUT_MS: "4000"
      PORT: "3001"
      SERVICE_NAME: identity
      SERVICE_TOKEN: ${IDENTITY_SERVICE_TOKEN:?IDENTITY_SERVICE_TOKEN must be configured}
      SERVICE_TOKENS: '{"customer":"${CUSTOMER_SERVICE_TOKEN:?CUSTOMER_SERVICE_TOKEN must be configured}","driver":"${DRIVER_SERVICE_TOKEN:?DRIVER_SERVICE_TOKEN must be configured}","gateway":"${GATEWAY_SERVICE_TOKEN:?GATEWAY_SERVICE_TOKEN must be configured}"}'
      IDENTITY_SERVICE_URL: http://identity-service:3001
      CUSTOMER_SERVICE_URL: http://customer-service:3002
      DRIVER_SERVICE_URL: http://driver-service:3003
      BOOKING_SERVICE_URL: http://booking-service:3004
      TRIP_SERVICE_URL: http://trip-service:3005
      PAYMENT_SERVICE_URL: http://payment-service:3006
      NOTIFICATION_SERVICE_URL: http://notification-service:3007
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: identity_db
      DB_USER: identity_user
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be configured}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3001/api/v1/readiness-checks',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: *a1
  customer-service:
    build:
      context: .
      dockerfile: services/customer/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
      REGISTRATION_SECRET: ${REGISTRATION_SECRET:?REGISTRATION_SECRET must be configured}
      OTP_SECRET: ${OTP_SECRET:?OTP_SECRET must be configured}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be configured}
      ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-v1}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      HTTP_TIMEOUT_MS: "4000"
      PORT: "3002"
      SERVICE_NAME: customer
      SERVICE_TOKEN: ${CUSTOMER_SERVICE_TOKEN:?CUSTOMER_SERVICE_TOKEN must be configured}
      SERVICE_TOKENS: '{"identity":"${IDENTITY_SERVICE_TOKEN:?IDENTITY_SERVICE_TOKEN must be configured}","booking":"${BOOKING_SERVICE_TOKEN:?BOOKING_SERVICE_TOKEN must be configured}","payment":"${PAYMENT_SERVICE_TOKEN:?PAYMENT_SERVICE_TOKEN must be configured}","trip":"${TRIP_SERVICE_TOKEN:?TRIP_SERVICE_TOKEN must be configured}","notification":"${NOTIFICATION_SERVICE_TOKEN:?NOTIFICATION_SERVICE_TOKEN must be configured}"}'
      IDENTITY_SERVICE_URL: http://identity-service:3001
      CUSTOMER_SERVICE_URL: http://customer-service:3002
      DRIVER_SERVICE_URL: http://driver-service:3003
      BOOKING_SERVICE_URL: http://booking-service:3004
      TRIP_SERVICE_URL: http://trip-service:3005
      PAYMENT_SERVICE_URL: http://payment-service:3006
      NOTIFICATION_SERVICE_URL: http://notification-service:3007
      MONGO_DB: customer_db
      MONGO_URI: mongodb://customer_user:${CUSTOMER_DB_PASSWORD:?CUSTOMER_DB_PASSWORD must be configured}@mongodb:27017/customer_db?replicaSet=rs0&authSource=customer_db
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3002/api/v1/readiness-checks',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: *a1
  driver-service:
    build:
      context: .
      dockerfile: services/driver/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
      REGISTRATION_SECRET: ${REGISTRATION_SECRET:?REGISTRATION_SECRET must be configured}
      OTP_SECRET: ${OTP_SECRET:?OTP_SECRET must be configured}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be configured}
